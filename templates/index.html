<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Clipper</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Video Clipper</h1>
    <form id="upload-form" action="/upload" method="post" enctype="multipart/form-data">
        <label for="video-upload">Select video:</label>
        <input id="video-upload" type="file" name="video" accept="video/*" required>
        <button type="submit">Upload and Transcribe</button>
    </form>
    <hr>
    <h2>Transcript</h2>
    <div id="transcript">
        <p>Your video transcript will appear here.</p>
    </div>
    <hr>
    <h2>Create Clip</h2>
    <form id="clip-form">
        <label for="start">Start Time:</label>
        <input type="text" id="start" name="start" placeholder="00:00:00" readonly>
        <label for="end">End Time:</label>
        <input type="text" id="end" name="end" placeholder="00:00:00" readonly>
        <button type="submit">Create Standard Clip</button>
        <button type="button" id="autoclip-button">Auto-Clip for Shorts</button>
    </form>

    <div id="manual-clipping-controls" style="display:none;">
        <hr>
        <h2>Manual Keyframe Clipping</h2>
        <p>Select a portion of the transcript above to load the video preview.</p>
        <div id="video-preview-container" style="position: relative; margin-top: 10px;">
            <video id="clip-preview" style="max-width: 100%; cursor: crosshair;" controls></video>
            <div id="keyframes-display" style="margin-top: 10px;"></div>
        </div>
        <button type="button" id="manual-clip-button" disabled>Generate Manual Clip</button>
    </div>

    <hr>
    <h2>Clip Result</h2>
    <div id="clip-result"></div>

    <script src="/static/app.js?v=1.2"></script>
</body>
</html>
